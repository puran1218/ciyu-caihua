<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="词语画猜">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>词语画猜</title>
</head>
<body data-mode="color">
  <div id="app">
    <section class="screen home active" id="homeScreen">
      <button class="more-btn" id="settingsBtn" aria-label="设置">···</button>
      <div class="home-card">
        <h1 class="app-name">词语<br>画猜</h1>
        <div class="style-switch" aria-label="画面风格">
          <button class="mode-btn selected" data-mode-option="color">彩色卡片</button>
          <button class="mode-btn" data-mode-option="mono">大字黑白</button>
        </div>
        <button class="primary" id="startBtn">开始玩</button>
      </div>
    </section>

    <section class="screen game" id="gameScreen">
      <div class="word-card" id="wordCard">
        <div class="word" id="wordText">词语</div>
      </div>
      <div class="game-controls">
        <button class="exit" id="exitBtn">退出</button>
        <button class="next" id="nextBtn">下一个</button>
      </div>
    </section>

    <div class="settings-backdrop" id="settingsBackdrop" hidden>
      <div class="settings-panel" role="dialog" aria-label="设置">
        <h2 class="settings-title">设置</h2>
        <div class="setting-group">
          <div class="setting-label">词语范围</div>
          <div class="seg" id="rangeSeg">
            <button data-range="all">全部</button>
            <button data-range="easy">简单</button>
            <button data-range="normal">普通</button>
            <button data-range="hard">难一点</button>
          </div>
        </div>
        <div class="setting-group">
          <div class="setting-label">四字词语</div>
          <div class="seg" id="fourSeg">
            <button data-four="on">要</button>
            <button data-four="off">不要</button>
          </div>
        </div>
        <div class="settings-actions">
          <button class="ghost" id="resetBtn">重置设置</button>
          <button class="done" id="closeSettingsBtn">完成</button>
        </div>
      </div>
    </div>

    <div class="portrait-hint">
      <div>
        横过手机<br>开始词语画猜
        <button class="portrait-dismiss" id="portraitDismissBtn">就竖着玩</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
